<style>
/* ===== TOKENS ===== */
:root{
--c-bg:#EFECE4;--c-surface:#FBFAF6;--c-text:#2A2A22;--c-muted:#5E5B4E;--c-line:#D6CFBD;
--c-primary:#2F5D3A;--c-on-primary:#fff;--c-earth:#7A4E2D;--c-accent:#F6D27A;--c-on-accent:#2A2A22;--c-success:#1F7A46;--c-focus:#B98A1E;--c-scrim:rgba(0,0,0,.38);
--e1:#B98A1E;--e2:#4F8A57;--e3:#B45A3C;--h1:#7A5A0E;--h2:#2F5D3A;--h3:#8F3F26;
--font-display:"Bitter",Georgia,serif;--font-body:"Nunito Sans",system-ui,sans-serif;
--fs-xs:.75rem;--fs-sm:.875rem;--fs-md:1rem;--fs-lg:1.125rem;--fs-xl:1.375rem;--fs-display:clamp(2.75rem,13vw,3.75rem);
--s-1:.25rem;--s-2:.5rem;--s-3:.75rem;--s-4:1rem;--s-5:1.5rem;--s-6:2rem;
--r-sm:10px;--r-md:14px;--r-lg:20px;--r-pill:99px;
--sh-1:0 2px 8px rgba(0,0,0,.10);--sh-2:0 8px 20px rgba(0,0,0,.18);
--dur-1:.15s;--dur-2:.35s;--ease:cubic-bezier(.2,.7,.2,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-bg:#1B1F19;--c-surface:#252A22;--c-text:#EEEADD;--c-muted:#B5B09E;--c-line:#3A4033;--c-primary:#6FAE78;--c-on-primary:#12180F;--c-earth:#C89468;--c-focus:#DDB24A}}
:root[data-theme="dark"]{--c-bg:#1B1F19;--c-surface:#252A22;--c-text:#EEEADD;--c-muted:#B5B09E;--c-line:#3A4033;--c-primary:#6FAE78;--c-on-primary:#12180F;--c-earth:#C89468;--c-focus:#DDB24A}
/* ===== BASE ===== */
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--c-bg);color:var(--c-text);font:var(--fs-md)/1.55 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15}
h2{font-size:var(--fs-xl);margin-bottom:var(--s-3);color:var(--c-earth)}
section{margin-top:var(--s-5)}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--s-4) var(--s-6)}
/* ===== COMPONENTS ===== */
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:48px;padding:0 var(--s-5);border:0;border-radius:var(--r-lg);font:800 var(--fs-lg)/1 var(--font-body);text-decoration:none;cursor:pointer;box-shadow:var(--sh-2);transition:transform var(--dur-1) var(--ease),filter var(--dur-1)}
.btn--primary{background:var(--c-primary);color:var(--c-on-primary)}
.btn--accent{background:var(--c-accent);color:var(--c-on-accent);border-radius:var(--r-pill)}
.btn--success{background:var(--c-success);color:#fff}
.btn--block{display:flex;width:100%}
.btn--sticky{position:sticky;bottom:calc(var(--s-3) + env(safe-area-inset-bottom,0px))}
.btn:active{transform:translateY(1px);filter:brightness(.94)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;pointer-events:none;box-shadow:none}
@media (hover:hover){.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.seg button:hover,.sw:hover,.pk:hover{border-color:var(--c-primary)}.tile:hover{transform:scale(1.02)}}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s-2)}
.seg button{min-height:48px;border:1.5px solid var(--c-line);background:var(--c-surface);color:var(--c-text);border-radius:var(--r-md);font:800 var(--fs-lg) var(--font-body);cursor:pointer;transition:background var(--dur-1),color var(--dur-1)}
.seg button[aria-pressed=true]{background:var(--c-primary);border-color:var(--c-primary);color:var(--c-on-primary)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.tile{position:relative;height:104px;border-radius:var(--r-md);overflow:hidden;border:3px solid transparent;padding:0;cursor:pointer;background:var(--c-line);transition:transform var(--dur-1) var(--ease)}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font:800 var(--fs-md) var(--font-body);padding:var(--s-5) var(--s-3) var(--s-2);text-align:left}
.tile[aria-pressed=true]{border-color:var(--c-accent);box-shadow:0 0 0 2px var(--c-accent)}
.tile[aria-pressed=true]::after{content:"✓";position:absolute;top:var(--s-2);right:var(--s-2);background:var(--c-accent);color:var(--c-on-accent);width:24px;height:24px;border-radius:50%;font-weight:800;line-height:24px;text-align:center}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2);margin-top:-34px;position:relative}
.feat .card{padding:var(--s-3) var(--s-2);text-align:center;box-shadow:var(--sh-2)}
.feat i{font-style:normal;font-size:var(--fs-xl)}
.feat b{display:block;font-size:var(--fs-sm);line-height:1.2;margin-top:var(--s-1)}
.feat small{display:block;color:var(--c-muted);font-size:var(--fs-xs);line-height:1.25;margin-top:var(--s-1)}
.day{overflow:hidden;border-radius:var(--r-lg);margin-bottom:var(--s-4)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-4);color:#fff}
.day.l1 .dh{background:var(--h1)}.day.l2 .dh{background:var(--h2)}.day.l3 .dh{background:var(--h3)}
.dh h3{font-size:var(--fs-lg)}
.dh span{font-size:var(--fs-xs);font-weight:700;text-align:right}
.it{display:flex;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-top:1px solid var(--c-line)}
.it:first-of-type{border-top:0}
.it>div:nth-child(2){flex:1}
.it b{display:block;line-height:1.25}
.it span{display:block;color:var(--c-muted);font-size:var(--fs-sm);line-height:1.35;margin-top:var(--s-1)}
.it em{font-style:normal;font-size:var(--fs-xs);color:var(--c-earth);font-weight:800}
.th{flex:none;width:104px;height:78px;border-radius:var(--r-sm);overflow:hidden}
.th svg{display:block;width:100%;height:100%}
.sw{flex:none;align-self:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--c-line);background:var(--c-bg);font-size:var(--fs-lg);cursor:pointer;transition:transform var(--dur-2) var(--ease)}
.sw:active{transform:rotate(180deg) scale(.9)}
.meter{padding:var(--s-3) var(--s-4);margin-bottom:var(--s-4);border-radius:var(--r-lg)}
.bars{display:flex;align-items:flex-end;gap:var(--s-2);height:64px;margin:var(--s-2) 0 var(--s-1)}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar{width:100%;border-radius:6px 6px 0 0;animation:grow .7s var(--ease) both}
.bar.l1{background:var(--e1)}.bar.l2{background:var(--e2)}.bar.l3{background:var(--e3)}
.bc small,.meter>small{color:var(--c-muted);font-size:var(--fs-xs)}
.prog{height:12px;background:var(--c-line);border-radius:var(--r-pill);overflow:hidden;margin-bottom:var(--s-3)}
.prog i{display:block;height:100%;width:0;background:var(--c-primary);transition:width var(--dur-2)}
.pk{display:flex;align-items:center;gap:var(--s-3);min-height:48px;padding:0 var(--s-3);margin-bottom:var(--s-2);cursor:pointer}
.pk input{width:20px;height:20px;accent-color:var(--c-primary)}
.pk.on span{text-decoration:line-through;color:var(--c-muted)}
details.card{margin-bottom:var(--s-2);padding:0 var(--s-4)}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--c-primary)}
details ul{margin:0 0 var(--s-3);padding-left:var(--s-5);color:var(--c-muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2A2A22;color:#fff;padding:var(--s-3) var(--s-4);border-radius:var(--r-pill);font-weight:700;font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:var(--dur-2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--c-muted);font-size:var(--fs-xs);margin-top:var(--s-6)}
#out[hidden]{display:none}
/* ===== HERO ===== */
.hero{position:relative;height:400px;overflow:hidden;color:#fff;background:#1F4D46}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.txt{position:relative;max-width:560px;margin:0 auto;padding:var(--s-4)}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--s-2)}
.pill{background:var(--c-scrim);border-radius:var(--r-pill);padding:var(--s-1) var(--s-3);font-size:var(--fs-sm);font-weight:700}
.lang{display:flex;border:1.5px solid #fff;border-radius:var(--r-pill);overflow:hidden}
.lang button{min-height:36px;background:none;border:0;color:#fff;padding:0 var(--s-3);font:700 var(--fs-sm) var(--font-body);cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#2F5D3A}
h1{font-size:var(--fs-display);font-weight:800;margin-top:var(--s-6);text-shadow:0 3px 14px rgba(0,0,0,.45)}
.tag{margin:var(--s-2) 0 var(--s-4);font-size:var(--fs-lg);max-width:22ch;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.55)}
#sun{animation:rise 1.6s ease-out both}
@keyframes rise{from{transform:translateY(70px);opacity:.2}to{transform:none;opacity:1}}
@keyframes grow{from{height:0!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

 if(type==="culture"){
  b=`<circle cx="${sx}" cy="34" r="20" fill="#FFF0B8" opacity=".9"/><rect y="66" width="320" height="74" fill="${c[3]}"/>`;
  for(let r=0;r<4;r++){const y=80+r*14;b+=`<path d="M0 ${y}H320" stroke="#0004" stroke-width="2"/>`;for(let x=(r%2)*22;x<320;x+=44)b+=`<path d="M${x} ${y-14}V${y}" stroke="#0004" stroke-width="2"/>`}
  b+=`<path d="M128 140L142 76H178L192 140Z" fill="#1B1F19"/><path d="M0 66H320" stroke="${c[2]}" stroke-width="6"/>`;
 }else if(type==="nature"){
  b=`<circle cx="${sx}" cy="30" r="16" fill="#FFF0B8" opacity=".9"/><path d="M0 100L70 40L120 80L190 20L260 84L320 50V140H0Z" fill="${c[2]}"/><path d="M190 20L172 42L190 36L204 44Z" fill="#fff" opacity=".9"/><path d="M0 112Q80 98 160 112T320 108V140H0Z" fill="#1F4D46" opacity=".6"/>`;
 }else if(type==="food"){
  b=`<rect y="88" width="320" height="52" fill="${c[3]}"/><ellipse cx="160" cy="100" rx="78" ry="20" fill="#0003"/><circle cx="160" cy="80" r="46" fill="#FBFAF6"/><circle cx="160" cy="80" r="34" fill="${c[2]}"/><circle cx="148" cy="74" r="9" fill="#F6D27A"/><circle cx="172" cy="88" r="8" fill="#D9603A"/><circle cx="166" cy="68" r="6" fill="#8CC794"/><path d="M140 30q-8-10 0-18M160 32q-8-10 0-20M180 30q-8-10 0-18" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>`;
 }else{
  const col=[c[3],"#F6D27A",c[2],"#FBFAF6"];
  for(let r=0;r<7;r++){const y=r*20;let p="";for(let x=0;x<=320;x+=20)p+=`${x},${y+((x/20)%2?16:3)} `;b+=`<rect y="${y}" width="320" height="20" fill="${col[r%4]}"/><polyline points="${p}" fill="none" stroke="${col[(r+2)%4]}" stroke-width="5"/>`}
 }
 return `<svg viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="320" height="140" fill="url(#${id})"/>${b}</svg>`;
}
function buildPlan(){
  const pick=sel.size?[...sel]:Object.keys(L.es.int);
  const by=pick.map(k=>A.filter(a=>a.i===k).sort((a,b)=>a.l-b.l));
  const q=[];for(let r=0;by.some(x=>r<x.length);r++)by.forEach(x=>x[r]&&q.push(x[r]));
  q.sort((a,b)=>a.l-b.l);
  const R={...REST,i:"nature"};
  const days=[{calm:1,items:[
    {i:"culture",t:["Llegada y descanso","Arrive and rest"],d:["Instálate, toma mate de coca y camina solo por los alrededores del hostal.","Settle in, sip coca tea and only stroll around the hostel."],l:1},
    {i:"food",t:["Cena temprana y liviana","Early, light dinner"],d:["Duerme temprano para acostumbrarte a la altura.","Sleep early to adjust to the altitude."],l:1}]}];
  for(let d=2;d<=n;d++){
    let it=[];const nx=q[0];
    if(!nx||(nx.l===3&&d<4))it=[R,{...R,i:"food",t:["Tarde libre","Free afternoon"]}];
    else if(nx.f)it=[q.shift()];
    else{it.push(q.shift());if(q[0]&&!q[0].f&&!(q[0].l===3&&d<4))it.push(q.shift());else it.push({...R,i:"food"});}
    days.push({items:it});
  }
  return days;
}
function render(){
  const T=L[lang],X=E[lang];
  document.documentElement.lang=lang;
  $("pill").textContent=X.pill;$("tag").textContent=X.tag;$("cta").textContent=X.cta;$("foot").textContent=X.foot;
  $("t1").textContent=T.t1;$("t2").textContent=T.t2;$("t3").textContent=T.t3;$("t4").textContent=T.t4;
  $("go").textContent=T.go;$("wa").textContent="💬 "+T.wa;
  $("bes").setAttribute("aria-pressed",lang==="es");$("ben").setAttribute("aria-pressed",lang==="en");
  $("feat").innerHTML=X.f.map(f=>`<div class="card"><i>${f[0]}</i><b>${f[1]}</b><small>${f[2]}</small></div>`).join("");
  $("days").innerHTML=[2,3,4,5,6,7].map(v=>`<button aria-pressed="${v===n}" data-d="${v}">${v}</button>`).join("");
  $("ints").innerHTML=Object.keys(T.int).map(k=>`<button class="tile" aria-pressed="${sel.has(k)}" data-i="${k}">${scene(k,hs(k))}<span>${T.int[k]}</span></button>`).join("");
  $("tips").innerHTML=T.tips.map(([h,ls])=>`<details class="card"><summary>${h}</summary><ul>${ls.map(x=>`<li>${x}</li>`).join("")}</ul></details>`).join("");
  $("t5").textContent=X.t5;renderPack();
  if(!$("out").hidden)renderPlan();
}
const pk=new Set();
function renderPack(){
  const X=E[lang];
  $("pack").innerHTML=X.pack.map((t,k)=>`<label class="card pk${pk.has(k)?" on":""}"><input type="checkbox" data-k="${k}"${pk.has(k)?" checked":""}><span>${t}</span></label>`).join("");
  $("pbar").style.width=pk.size/X.pack.length*100+"%";
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}
function renderPlan(){
  const T=L[lang],X=E[lang],i=lang==="es"?0:1;
  const mxs=plan.map(d=>Math.max(...d.items.map(x=>x.l)));
  let h=`<div class="card meter"><b>${X.meter}</b><div class="bars">${mxs.map((m,k)=>`<div class="bc"><div class="bar l${m}" style="height:${m*32}%"></div><small>${k+1}</small></div>`).join("")}</div><small>${X.ml}</small></div>`;
  h+=plan.map((d,k)=>{
    const mx=mxs[k],pace=d.calm?T.calm:mx===3?T.hard:mx===2?T.mid:T.calm;
    return `<div class="card day l${d.calm?1:mx}"><div class="dh"><h3>${T.day} ${k+1}</h3><span>${pace}</span></div>`+
    d.items.map((x,j)=>`<div class="it"><div class="th">${scene(x.i||"nature",hs(x.t[0]))}</div><div>${x.f?`<em>${T.full}</em>`:""}<b>${x.t[i]}</b><span>${x.d[i]}</span></div><button class="sw" data-d="${k}" data-x="${j}" aria-label="${X.swap}">🔄</button></div>`).join("")+`</div>`;}).join("");
  $("plan").innerHTML=h;
  const names=(sel.size?[...sel]:Object.keys(T.int)).map(k=>T.int[k]).join(", ");
  const lines=plan.map((d,k)=>`${T.day} ${k+1}: `+d.items.map(x=>x.t[i]).join(", ")).join("\n");
  $("wa").href=`https://wa.me/${HOSTEL_PHONE}?text=${encodeURIComponent(T.msg(n,names)+"\n\n"+lines)}`;
}
$("plan").onclick=e=>{
  const b=e.target.closest(".sw");if(!b)return;
  const k=+b.dataset.d,j=+b.dataset.x,it=plan[k].items[j];
  const pick=sel.size?[...sel]:Object.keys(L.es.int);
  const used=new Set(plan.flatMap(d=>d.items.map(x=>x.t[0])));
  const cap=k===0?1:k<3?2:3;
  const c=A.filter(a=>pick.includes(a.i)&&!used.has(a.t[0])&&!!a.f===!!it.f&&a.l<=cap);
  if(!c.length){toast(E[lang].none);return}
  plan[k].items[j]=c[Math.floor(Math.random()*c.length)];renderPlan();
};
$("pack").onchange=e=>{const k=+e.target.dataset.k;e.target.checked?pk.add(k):pk.delete(k);renderPack();if(pk.size===E[lang].pack.length)toast(E[lang].done)};
$("days").onclick=e=>{const b=e.target.closest("button");if(!b)return;n=+b.dataset.d;render();if(!$("out").hidden){plan=buildPlan();renderPlan();}};
$("ints").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.i;sel.has(k)?sel.delete(k):sel.add(k);if(!$("out").hidden)plan=buildPlan();render();};
$("go").onclick=()=>{plan=buildPlan();$("out").hidden=false;renderPlan();$("out").scrollIntoView({behavior:"smooth"});};
$("bes").onclick=()=>{lang="es";render();};$("ben").onclick=()=>{lang="en";render();};
render();
</script>
